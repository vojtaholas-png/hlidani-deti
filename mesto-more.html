<style>
:root{
  --paper:#f7f3ea; --card:#fffdf8; --ink:#1f2a44; --muted:#6b7185; --line:#e4dccb;
  --grid:rgba(36,87,214,.07); --accent:#2457d6; --accent-ink:#fff; --red:#e23b2e;
  --green:#1e9e5a; --amber:#c27a00; --soft:#efe8d8; --shadow:0 1px 0 rgba(31,42,68,.06),0 6px 20px -10px rgba(31,42,68,.25);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12151c; --card:#1b2030; --ink:#edf0f7; --muted:#9aa2b8; --line:#2b3246;
    --grid:rgba(120,150,255,.05); --accent:#6d93ff; --accent-ink:#0d1222; --red:#ff5a4e;
    --green:#3ccf86; --amber:#f0b03a; --soft:#232a3d; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.hand{font-family:Caveat,cursive}
.muted{color:var(--muted)}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;font-weight:700;font-size:17px;padding:0 18px;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
input.txt{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:17px;padding:0 14px;outline:none}
input.txt:focus{border-color:var(--accent)}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;display:block}

/* home */
.hero{text-align:center;padding:28px 0 18px}
.hero h1{font-size:54px;font-weight:800;line-height:.95}
.hero h1 span{color:var(--red)}
.hero .hand{font-size:26px;color:var(--accent);margin-top:6px;transform:rotate(-2deg);display:inline-block}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:6px 0}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.codein{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;font-size:24px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .code{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:.12em;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:18px}

/* lobby */
.bigcode{display:flex;gap:14px;align-items:center}
.bigcode .c{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:46px;letter-spacing:.14em;line-height:1}
.qr{width:116px;height:116px;background:#fff;border-radius:12px;padding:8px;flex:none;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 12px;font-size:15px;font-weight:600}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.off{opacity:.45}
.chip button{font-size:16px;line-height:1;color:var(--muted);padding:0 0 0 2px}
.chip.add{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--paper) 30%);z-index:5}
.sticky .in{max-width:560px;margin:0 auto}
.wait{text-align:center;color:var(--muted);font-weight:600;padding:14px}

/* draw */
.drawbox{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.slot{width:200px;height:200px;border-radius:36px;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:120px;line-height:1;color:var(--ink)}
.slot.final{color:var(--red);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* play */
.playhead{display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:4;background:var(--paper);padding:8px 0 10px;margin-top:-8px}
.badge{width:64px;height:64px;border-radius:18px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:38px;flex:none}
.timer{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .3s linear}
.field{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px 4px;box-shadow:var(--shadow)}
.field span{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input{width:100%;border:0;background:transparent;color:var(--ink);outline:none;font-family:Caveat,cursive;font-size:30px;font-weight:700;padding:0 0 2px;line-height:1.2}
.field input::placeholder{color:var(--line)}
.field.ok{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.field.bad span{color:var(--red)}
.stopbtn{width:100%;min-height:64px;border-radius:18px;background:var(--red);color:#fff;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:28px;letter-spacing:.1em;box-shadow:0 8px 22px -8px var(--red)}
.stopbtn[disabled]{background:var(--soft);color:var(--muted);box-shadow:none}
.stophint{text-align:center;font-size:13px;color:var(--muted);margin-top:6px}

/* stop */
.stamp{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:96px;color:var(--red);border:8px solid var(--red);border-radius:22px;padding:4px 24px;transform:rotate(-8deg);animation:stamp .35s ease-out}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.2);opacity:0}100%{transform:rotate(-8deg) scale(1);opacity:1}}

/* review */
.cat h3{font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.ans{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ans:first-of-type{border-top:0}
.ans .who{width:76px;flex:none;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ans .who i{width:8px;height:8px;border-radius:50%;flex:none}
.ans .t{flex:1;min-width:0;font-family:Caveat,cursive;font-size:26px;font-weight:700;line-height:1.1;word-break:break-word}
.ans .t.empty{font-family:inherit;font-size:14px;color:var(--muted);font-weight:400}
.ans.invalid .t:not(.empty){text-decoration:line-through;text-decoration-color:var(--red);opacity:.6}
.pts{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;min-width:42px;text-align:center;border-radius:9px;padding:4px 6px;background:var(--soft)}
.pts.p20{background:var(--green);color:#fff}
.pts.p10{background:color-mix(in srgb,var(--green) 22%,var(--card));color:var(--green)}
.pts.p5{background:color-mix(in srgb,var(--amber) 22%,var(--card));color:var(--amber)}
.pts.p0{color:var(--muted)}
.vote{min-width:52px;height:36px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;font-weight:700;color:var(--muted);flex:none}
.vote.on{background:var(--red);border-color:var(--red);color:#fff}
.vote.ghost{visibility:hidden}
.why{font-size:11px;color:var(--red);font-weight:600;display:block;font-family:system-ui,sans-serif}

/* results */
.lb{padding:0;overflow:hidden}
.lbrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.lbrow:first-child{border-top:0}
.rank{width:28px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.lbrow .nm{font-weight:700;font-size:17px}
.plus{font-weight:700;color:var(--green);font-size:14px}
.tot{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
.detail{padding:4px 16px 14px 56px;display:none}
.detail.open{display:block}
.drow{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:15px;align-items:center}
.drow b{font-family:Caveat,cursive;font-size:22px}
.drow .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.me-tag{font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}

/* podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0 8px}
.pod{flex:1;max-width:120px;text-align:center}
.pod .blk{border-radius:14px 14px 4px 4px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:34px;box-shadow:var(--shadow)}
.pod .n{font-weight:700;margin-bottom:6px;word-break:break-word}
.pod .s{font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
pre.rules{background:var(--soft);border-radius:12px;padding:12px;font-size:13px;overflow:auto}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* ================= konstanty ================= */
const COL = 'mestoMore';
const LETTERS_ALL = ['A','B','C','Č','D','E','F','G','H','CH','I','J','K','L','M','N','O','P','R','Ř','S','Š','T','U','V','Z','Ž'];
const LETTERS_SPECIAL = ['Č','CH','Ř','Š','Ž'];
const CATS_DEFAULT = ['Země','Město','Řeka','Hora','Jméno','Zvíře','Rostlina','Věc'];
const CATS_SUGGEST = ['Moře','Povolání','Jídlo','Sportovec','Značka auta','Film','Zpěvák / kapela','Sport','Fotbalový klub','Pití','Část těla','Hudební nástroj'];
const TIME_OPTS = [[0,'Žádný'],[60,'1 min'],[90,'1,5 min'],[120,'2 min'],[180,'3 min']];
const COLORS = ['#e23b2e','#2457d6','#1e9e5a','#d98a00','#8e44ad','#0e9aa7','#c2185b','#5d6d7e','#7cb342','#f4511e','#3949ab','#00897b','#a1887f','#6d4c41'];
const ACTIVE_MS = 35000;
const DRAW_MS = 3400;

/* ================= utility ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LSP = 'mm_';
const ls = {
  get(k){ try{ return localStorage.getItem(LSP+k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(LSP+k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(LSP+k) }catch(e){} }
};
let myId = ls.get('pid');
if(!myId){ myId = 'p' + Math.random().toString(36).slice(2,10); ls.set('pid', myId); }

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
const norm = s => String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('cs');
const fold = s => norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
function startsOK(text, letter){
  const s = norm(text), L = letter.toLocaleLowerCase('cs');
  if(!s) return false;
  if(L === 'ch') return s.startsWith('ch');
  if(L === 'c') return s.startsWith('c') && !s.startsWith('ch');
  return s.startsWith(L);
}
const fmtTime = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
const genCode = () => { const a='ABCDEFGHJKLMNPRSTUVXZ'; let c=''; for(let i=0;i<4;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; };
function beep(){
  try{
    const ac = beep.ac || (beep.ac = new (window.AudioContext||window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='square'; o.frequency.value = 880; g.gain.value = .08;
    o.connect(g); g.connect(ac.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .35); o.stop(ac.currentTime + .36);
  }catch(e){}
}

/* ================= stav ================= */
const S = {
  code:null, room:null, players:{}, answers:{}, votes:{},
  unsub:[], roundUnsub:[], subRound:null,
  mountedKey:null, myAns:[], myAnsRound:null, flushedRound:null,
  myRej:null, myRejRound:null, hostLock:{}, saveT:null, openRow:null, wake:null
};
let db = null, roomRef = null;

const configured = () => FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('VLOZ');
const isActive = p => p && (Date.now() - (p.lastSeen||0)) < ACTIVE_MS;
const sortedPlayers = () => Object.entries(S.players).sort((a,b)=>(a[1].joinedAt||0)-(b[1].joinedAt||0));
function colorOf(pid){
  const i = sortedPlayers().findIndex(([id])=>id===pid);
  return COLORS[(i<0?0:i) % COLORS.length];
}
const nameOf = pid => (S.players[pid] && S.players[pid].name) || (S.room?.last?.names?.[pid]) || 'Hráč';
const activeIds = () => sortedPlayers().filter(([,p])=>isActive(p)).map(([id])=>id);
function effectiveHost(){
  const r = S.room; if(!r) return null;
  if(isActive(S.players[r.host])) return r.host;
  const a = activeIds(); return a.length ? a[0] : r.host;
}
const amHost = () => effectiveHost() === myId;

/* ================= vstup / místnosti ================= */
function init(){
  if(!configured()){ renderSetup(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }catch(e){ renderSetup('Firebase se nepodařilo spustit: '+e.message); return; }
  const url = new URL(location.href);
  const qCode = (url.searchParams.get('r')||'').toUpperCase().slice(0,4);
  const saved = ls.get('room');
  if(qCode && qCode !== saved){ renderHome(qCode); return; }
  if(saved && ls.get('name')){ joinRoom(saved, ls.get('name'), true); return; }
  renderHome(qCode);
}

async function createRoom(){
  const name = ($('#name').value||'').trim();
  if(!name){ toast('Napiš své jméno'); $('#name').focus(); return; }
  ls.set('name', name);
  busy(true);
  try{
    let code, ref;
    for(let i=0;i<6;i++){
      code = genCode(); ref = db.collection(COL).doc(code);
      const s = await ref.get(); if(!s.exists) break;
    }
    await ref.set({
      code, host: myId, createdAt: Date.now(), phase:'lobby', round:0, letter:'',
      used:[], categories: CATS_DEFAULT.slice(), timeLimit:0, special:true,
      scores:{}, rounds:[], last:null, playStart:0, stopAt:0, stoppedBy:null, stopReason:null
    });
    await joinRoom(code, name);
  }catch(e){ console.error(e); toast('Nepodařilo se založit hru'); busy(false); }
}

async function joinFromHome(){
  const name = ($('#name').value||'').trim();
  const code = ($('#code').value||'').trim().toUpperCase();
  if(!name){ toast('Napiš své jméno'); $('#name').focus(); return; }
  if(code.length !== 4){ toast('Kód má 4 písmena'); $('#code').focus(); return; }
  ls.set('name', name);
  busy(true);
  const ok = await joinRoom(code, name);
  if(!ok) busy(false);
}

async function joinRoom(code, name, silent){
  try{
    const ref = db.collection(COL).doc(code);
    const s = await ref.get();
    if(!s.exists){
      ls.del('room');
      if(silent) renderHome(); else toast('Místnost '+code+' neexistuje');
      return false;
    }
    const pref = ref.collection('players').doc(myId);
    const ps = await pref.get();
    await pref.set({ name, joinedAt: ps.exists ? (ps.data().joinedAt||Date.now()) : Date.now(), lastSeen: Date.now() }, { merge:true });
    ls.set('room', code);
    history.replaceState(null, '', location.pathname + '?r=' + code);
    enterRoom(code, ref);
    return true;
  }catch(e){ console.error(e); toast('Chyba připojení'); if(silent) renderHome(); return false; }
}

function enterRoom(code, ref){
  leaveSubs();
  S.code = code; roomRef = ref; S.room = null; S.players = {}; S.mountedKey = null;
  S.unsub.push(ref.onSnapshot(s => {
    if(!s.exists){ toast('Hra byla zrušena'); leaveRoom(); return; }
    S.room = s.data();
    if(S.subRound !== S.room.round) subscribeRound(S.room.round);
    render(true);
  }));
  S.unsub.push(ref.collection('players').onSnapshot(qs => {
    const p = {}; qs.forEach(d => p[d.id] = d.data()); S.players = p; render(true);
  }));
}

function subscribeRound(r){
  S.roundUnsub.forEach(u=>u()); S.roundUnsub = [];
  S.subRound = r; S.answers = {}; S.votes = {};
  if(!r) return;
  S.roundUnsub.push(roomRef.collection('answers').where('round','==',r).onSnapshot(qs => {
    const a = {}; qs.forEach(d => { const x = d.data(); a[x.pid] = x; }); S.answers = a; render(true);
  }));
  S.roundUnsub.push(roomRef.collection('votes').where('round','==',r).onSnapshot(qs => {
    const v = {}; qs.forEach(d => { const x = d.data(); v[x.pid] = x; }); S.votes = v;
    if(S.myRejRound !== r){ S.myRej = new Set((v[myId] && v[myId].rej) || []); S.myRejRound = r; }
    render(true);
  }));
}

/* ================= odpovědi ================= */
function ensureMyAns(){
  const r = S.room;
  if(S.myAnsRound === r.round && S.myAns.length === r.categories.length) return;
  let draft = null;
  try{ draft = JSON.parse(ls.get('draft_'+S.code+'_'+r.round) || 'null'); }catch(e){}
  const remote = S.answers[myId] && S.answers[myId].a;
  S.myAns = r.categories.map((_,i) => (draft && draft[i]) || (remote && remote[i]) || '');
  S.myAnsRound = r.round;
}
function saveAnswers(locked){
  const r = S.room; if(!r || !roomRef) return Promise.resolve();
  ls.set('draft_'+S.code+'_'+r.round, JSON.stringify(S.myAns));
  return roomRef.collection('answers').doc(r.round+'_'+myId)
    .set({ round:r.round, pid:myId, a:S.myAns.slice(), locked:!!locked, t:Date.now() })
    .catch(e=>console.error(e));
}
function queueSave(){ clearTimeout(S.saveT); S.saveT = setTimeout(()=>saveAnswers(false), 700); }

async function pressStop(reason){
  const r = S.room; if(!r || r.phase !== 'play') return;
  if(reason !== 'time'){ clearTimeout(S.saveT); await saveAnswers(true); S.flushedRound = r.round; }
  try{
    await db.runTransaction(async tx => {
      const s = await tx.get(roomRef); const d = s.data();
      if(d.phase !== 'play' || d.round !== r.round) return;
      tx.update(roomRef, { phase:'stop', stoppedBy: reason==='time' ? null : myId, stopReason: reason||'button', stopAt: Date.now() });
    });
  }catch(e){ console.error(e); }
}

/* ================= vyhodnocení ================= */
function evaluate(){
  const r = S.room, L = r.letter, cats = r.categories;
  const act = activeIds();
  const pidSet = new Set([...Object.keys(S.answers), ...act]);
  const pids = sortedPlayers().map(([id])=>id).filter(id=>pidSet.has(id));
  Object.keys(S.answers).forEach(id => { if(!pids.includes(id)) pids.push(id); });
  const rejCount = {};
  Object.values(S.votes).forEach(v => {
    if(!act.includes(v.pid) && !S.players[v.pid]) return;
    (v.rej||[]).forEach(k => {
      const [target] = k.split('|');
      if(target === v.pid) return;
      rejCount[k] = (rejCount[k]||0) + 1;
    });
  });
  const totals = {}; pids.forEach(p=>totals[p]=0);
  const out = cats.map((name, i) => {
    const entries = pids.map(pid => {
      const text = String((S.answers[pid] && S.answers[pid].a && S.answers[pid].a[i]) || '').trim();
      const voters = act.filter(id=>id!==pid).length;
      const rej = rejCount[pid+'|'+i] || 0;
      const need = Math.floor(voters/2) + 1;
      let valid = true, reason = null;
      if(!text){ valid = false; reason = 'empty'; }
      else if(!startsOK(text, L)){ valid = false; reason = 'letter'; }
      else if(voters > 0 && rej >= need){ valid = false; reason = 'votes'; }
      return { pid, text, valid, reason, rej, voters, need, pts:0 };
    });
    const valid = entries.filter(e=>e.valid);
    valid.forEach(e => {
      if(valid.length === 1) e.pts = 20;
      else e.pts = valid.some(o => o !== e && fold(o.text) === fold(e.text)) ? 5 : 10;
      totals[e.pid] += e.pts;
    });
    return { name, entries };
  });
  return { pids, cats: out, totals };
}

/* ================= akce hostitele ================= */
function hostOnce(key, fn){
  const now = Date.now();
  if(S.hostLock[key] && now - S.hostLock[key] < 2500) return;
  S.hostLock[key] = now; fn();
}
async function drawLetter(){
  const r = S.room;
  const letters = r.special ? LETTERS_ALL : LETTERS_ALL.filter(l=>!LETTERS_SPECIAL.includes(l));
  let used = (r.used||[]).filter(l=>letters.includes(l));
  let pool = letters.filter(l=>!used.includes(l));
  if(!pool.length){ pool = letters.slice(); used = []; }
  const letter = pool[Math.floor(Math.random()*pool.length)];
  if(!r.categories.length){ toast('Přidej aspoň jednu kategorii'); return; }
  await roomRef.update({
    phase:'play', round:(r.round||0)+1, letter, used:[...used, letter],
    playStart: Date.now() + DRAW_MS, stoppedBy:null, stopReason:null, stopAt:0
  });
}
async function computeScores(){
  const ev = evaluate();
  try{
    await db.runTransaction(async tx => {
      const s = await tx.get(roomRef); const d = s.data();
      if(d.phase !== 'review' || d.round !== S.room.round) return;
      const scores = Object.assign({}, d.scores||{});
      const names = Object.assign({}, (d.last && d.last.names) || {});
      const rows = {};
      ev.pids.forEach(p => {
        scores[p] = (scores[p]||0) + ev.totals[p];
        names[p] = nameOf(p);
        rows[p] = {
          ans: ev.cats.map(c => c.entries.find(e=>e.pid===p).text),
          pts: ev.cats.map(c => c.entries.find(e=>e.pid===p).pts),
          why: ev.cats.map(c => c.entries.find(e=>e.pid===p).reason || ''),
          total: ev.totals[p]
        };
      });
      Object.keys(scores).forEach(p => { if(!names[p]) names[p] = nameOf(p); });
      tx.update(roomRef, {
        phase:'results', scores,
        last:{ round:d.round, letter:d.letter, categories:d.categories, rows, names },
        rounds:[...(d.rounds||[]), { round:d.round, letter:d.letter, pts:ev.totals }]
      });
    });
  }catch(e){ console.error(e); toast('Nepodařilo se spočítat body'); }
}
function hostLoop(){
  const r = S.room; if(!r || !amHost()) return;
  const now = Date.now();
  if(r.phase === 'play' && r.timeLimit && now > r.playStart + r.timeLimit*1000){
    hostOnce('time'+r.round, () => pressStop('time'));
  }
  if(r.phase === 'stop'){
    const act = activeIds();
    const locked = act.filter(id => S.answers[id] && S.answers[id].locked).length;
    if(locked >= act.length || now > (r.stopAt||0) + 6000){
      hostOnce('review'+r.round, () => roomRef.update({ phase:'review' }));
    }
  }
}

/* ================= render ================= */
function busy(on){ document.querySelectorAll('#app .btn').forEach(b => b.disabled = !!on); }

function screenKey(){
  const r = S.room; if(!r) return 'loading';
  let k = r.phase + '|' + r.round + '|' + (amHost()?'H':'P');
  if(r.phase === 'play') k += Date.now() < r.playStart ? '|draw' : '|go';
  return k;
}

function render(dataChanged){
  if(!S.code) return;
  const r = S.room;
  // automatický flush odpovědí po STOP
  if(r && (r.phase === 'stop' || r.phase === 'review') && S.flushedRound !== r.round && S.myAnsRound === r.round){
    S.flushedRound = r.round; clearTimeout(S.saveT); saveAnswers(true);
  } else if(r && r.phase === 'stop' && S.flushedRound !== r.round){
    S.flushedRound = r.round; ensureMyAns(); saveAnswers(true);
  }
  const key = screenKey();
  if(key !== S.mountedKey){
    const prev = S.mountedKey; S.mountedKey = key;
    mount(prev); dataChanged = true;
  }
  updateLive();
  if(dataChanged) updateData();
}

function bindTop(){
  const l = $('#leaveBtn'); if(l) l.onclick = () => { if(confirm('Opravdu odejít ze hry?')) leaveRoom(); };

  try{ await navigator.clipboard.writeText(url); toast('Odkaz zkopírován'); }catch(e){ prompt('Zkopíruj odkaz:', url); }

function mount(prev){
  const app = $('#app'), r = S.room;
  if(S.wake && !(r && r.phase === 'play')){ try{ S.wake.release(); }catch(e){} S.wake = null; }
  if(!r){ app.innerHTML = `<div class="drawbox"><span class="spin"></span></div>`; return; }
  window.scrollTo(0,0);
  if(r.phase === 'lobby') return mountLobby();
  if(r.phase === 'play') return Date.now() < r.playStart ? mountDraw() : mountPlay(prev);
  if(r.phase === 'stop') return mountStop();
  if(r.phase === 'review') return mountReview();
  if(r.phase === 'results') return mountResults();
  if(r.phase === 'final') return mountFinal();
}

function updateLive(){
  const r = S.room; if(!r) return;
  const tp = $('#topPlayers');
  if(tp){ const n = activeIds().length; tp.textContent = n + (n===1?' hráč':n<5?' hráči':' hráčů'); }
  if(r.phase === 'play'){
    const now = Date.now();
    if(now < r.playStart){
      const slot = $('#slot'); if(!slot) return;
      const left = r.playStart - now;
      if(left > 900){
        const pool = r.special ? LETTERS_ALL : LETTERS_ALL.filter(l=>!LETTERS_SPECIAL.includes(l));
        const step = left > 2000 ? 70 : left > 1400 ? 140 : 240;
        if(!slot._t || now - slot._t > step){ slot._t = now; slot.textContent = pool[Math.floor(Math.random()*pool.length)]; }
      } else if(!slot.classList.contains('final')){
        slot.textContent = r.letter; slot.classList.add('final');
        try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
        $('#drawTxt').textContent = 'Písmeno je ' + r.letter + '!';
      }
    } else {
      const t = $('#timer'), bar = $('#timebar');
      if(!t) return;
      if(r.timeLimit){
        const rem = r.playStart + r.timeLimit*1000 - now;
        t.textContent = fmtTime(rem); t.classList.toggle('low', rem < 15000);
        bar.style.width = Math.max(0, Math.min(100, rem / (r.timeLimit*10))) + '%';
      } else {
        t.textContent = fmtTime(now - r.playStart);
      }
    }
  }
}

function updateData(){
  const r = S.room; if(!r) return;
  if(r.phase === 'lobby') updateLobby();
  else if(r.phase === 'stop') updateStop();
  else if(r.phase === 'review') updateReview();
  else if(r.phase === 'results') updateResults();
  else if(r.phase === 'final') updateFinal();
}

    <div class="stamp">STOP</div>
    <div class="disp" style="font-size:24px;margin-top:34px">${r.stopReason==='time' ? 'Čas vypršel!' : esc(r.stoppedBy===myId ? 'Zastavil(a) jsi kolo!' : nameOf(r.stoppedBy) + ' zastavil(a) kolo')}</div>
    <div class="row muted" style="margin-top:16px;justify-content:center"><span class="spin"></span><span id="collect">Sbírám odpovědi…</span></div>
  </div>`;
  bindTop();
}
function updateStop(){
  const act = activeIds();
  const n = act.filter(id => S.answers[id] && S.answers[id].locked).length;
  const c = $('#collect'); if(c) c.textContent = `Sbírám odpovědi… ${n}/${act.length}`;
}

/* ---------- kontrola ---------- */
function mountReview(){
  const r = S.room, host = amHost();
  $('#app').innerHTML = `${topBar()}
  <div class="row" style="margin-bottom:12px">
    <div class="badge" style="width:52px;height:52px;font-size:30px;border-radius:14px">${esc(r.letter)}</div>
    <div class="grow"><h2 style="font-size:24px">Kontrola</h2>
    <div class="muted sm">Klepni na 👎 u odpovědi, která neplatí. Rozhoduje většina.</div></div>
  </div>
  <div class="stack" id="review"></div>
  <div class="sticky"><div class="in">${host
    ? `<button class="btn primary" id="scoreBtn">Spočítat body</button>`
    : `<div class="wait">Hostitel spočítá body, až budete hotovi</div>`}</div></div>`;
  bindTop();
  if(host) $('#scoreBtn').onclick = () => hostOnce('score'+r.round, computeScores);
  $('#review').addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if(!b) return;
    toggleVote(b.dataset.v);
  });
}
function toggleVote(k){
  const r = S.room;
  if(S.myRejRound !== r.round){ S.myRej = new Set(); S.myRejRound = r.round; }
  if(S.myRej.has(k)) S.myRej.delete(k); else S.myRej.add(k);
  S.votes[myId] = { round:r.round, pid:myId, rej:[...S.myRej] };
  updateReview();
  roomRef.collection('votes').doc(r.round+'_'+myId).set({ round:r.round, pid:myId, rej:[...S.myRej] }).catch(e=>console.error(e));
}
function ptsChip(e){
  if(!e.valid){
    return `<span class="pts p0">0</span>`;
  }
  return `<span class="pts p${e.pts}">+${e.pts}</span>`;
}
function updateReview(){
  const ev = evaluate();
  const mine = S.myRej || new Set();
  $('#review').innerHTML = ev.cats.map((c, i) => `
    <div class="card cat">
      <h3><span>${esc(c.name)}</span></h3>
      ${c.entries.map(e => {
        const k = e.pid + '|' + i;
        const canVote = e.pid !== myId && e.text && e.reason !== 'letter';
        const why = e.reason === 'letter' ? 'jiné písmeno' : e.reason === 'votes' ? 'zamítnuto hlasováním' : '';
        return `<div class="ans ${e.valid ? '' : 'invalid'}">
          <div class="who"><i style="background:${colorOf(e.pid)}"></i>${esc(e.pid===myId ? 'Ty' : nameOf(e.pid))}</div>
          <div class="t ${e.text ? '' : 'empty'}">${e.text ? esc(e.text) : '— nic —'}${why ? `<span class="why">${why}</span>` : ''}</div>
          ${ptsChip(e)}
          <button class="vote ${canVote ? '' : 'ghost'} ${mine.has(k) ? 'on' : ''}" ${canVote ? `data-v="${esc(k)}"` : 'tabindex="-1" aria-hidden="true"'} aria-label="Zamítnout odpověď">👎${e.rej ? ' '+e.rej : ''}</button>
        </div>`;
      }).join('')}
    </div>`).join('');
}

/* ---------- výsledky ---------- */
function leaderboard(){
  const r = S.room, scores = r.scores || {};
  return Object.keys(scores).sort((a,b) => (scores[b]||0) - (scores[a]||0)).map(p => ({ pid:p, score:scores[p]||0 }));
}
function mountResults(){
  const r = S.room, host = amHost();
  S.openRow = myId;
  $('#app').innerHTML = `${topBar()}
  <div class="row" style="margin-bottom:12px">
    <div class="badge" style="width:52px;height:52px;font-size:30px;border-radius:14px">${esc(r.last ? r.last.letter : r.letter)}</div>
    <div class="grow"><h2 style="font-size:24px">Výsledky kola ${r.round}</h2>
    <div class="muted sm">Klepni na hráče pro jeho odpovědi</div></div>
  </div>
  <div class="card lb" id="lb"></div>
  <div class="sticky"><div class="in">${host
    ? `<div class="stack"><button class="btn primary" id="nextBtn">🎲 Další písmeno</button>
       <div class="row"><button class="btn ghost" id="setBtn" style="font-size:15px">Kategorie</button><button class="btn danger" id="endBtn" style="font-size:15px">Konec hry</button></div></div>`
    : `<div class="wait">Čekáme na další kolo…</div>`}</div></div>`;
  bindTop();
  if(host){
    $('#nextBtn').onclick = () => hostOnce('draw', drawLetter);
    $('#setBtn').onclick = () => roomRef.update({ phase:'lobby' });
    $('#endBtn').onclick = () => { if(confirm('Ukončit hru a ukázat konečné pořadí?')) roomRef.update({ phase:'final' }); };
  }
  $('#lb').addEventListener('click', e => {
    const b = e.target.closest('[data-row]'); if(!b) return;
    S.openRow = S.openRow === b.dataset.row ? null : b.dataset.row; updateResults();
  });
}
function updateResults(){
  const r = S.room, last = r.last; if(!last) return;
  const lb = leaderboard();
  let prev = null, rank = 0;
  $('#lb').innerHTML = lb.map((x, i) => {
    if(x.score !== prev){ rank = i+1; prev = x.score; }
    const row = last.rows[x.pid];
    const nm = (last.names && last.names[x.pid]) || nameOf(x.pid);
    return `<button class="lbrow" data-row="${x.pid}">
      <span class="rank">${rank}</span>
      <span class="grow"><span class="nm">${esc(nm)}</span>${x.pid===myId?'<span class="me-tag">ty</span>':''}<br>
      <span class="plus">${row ? '+'+row.total+' v tomto kole' : '<span class="muted">nehrál(a)</span>'}</span></span>
      <span class="tot">${x.score}</span>
    </button>
    <div class="detail ${S.openRow===x.pid?'open':''}">${row ? last.categories.map((c,ci) => `
      <div class="drow"><span><span class="k">${esc(c)}</span><br><b style="${row.pts[ci]?'':'text-decoration:line-through;opacity:.5'}">${row.ans[ci] ? esc(row.ans[ci]) : '—'}</b></span>
      <span class="pts p${row.pts[ci]}">${row.pts[ci] ? '+'+row.pts[ci] : '0'}</span></div>`).join('') : ''}</div>`;
  }).join('');
}

/* ---------- konec ---------- */
function mountFinal(){
  const host = amHost();
  $('#app').innerHTML = `${topBar()}
  <div style="text-align:center;margin-top:8px"><h2 style="font-size:32px">Konečné pořadí</h2><div class="muted" id="fsub"></div></div>
  <div class="podium" id="podium"></div>
  <div class="card lb" id="flb"></div>
  <div class="sticky"><div class="in">${host
    ? `<button class="btn primary" id="newBtn">Nová hra</button>`
    : `<button class="btn ghost" id="outBtn">Odejít</button>`}</div></div>`;
  bindTop();
  if(host) $('#newBtn').onclick = () => { if(confirm('Začít novou hru? Body se vynulují.')) roomRef.update({ phase:'lobby', round:0, used:[], scores:{}, rounds:[], last:null, letter:'' }); };
  else $('#outBtn').onclick = leaveRoom;
}
function updateFinal(){
  const r = S.room, lb = leaderboard();
  const nm = p => (r.last && r.last.names && r.last.names[p]) || nameOf(p);
  $('#fsub').textContent = `Odehráno kol: ${(r.rounds||[]).length}`;
  const order = [1,0,2], h = [110,150,80], medal = ['🥇','🥈','🥉'];
  $('#podium').innerHTML = order.filter(i => lb[i]).map(i => `
    <div class="pod"><div class="n">${esc(nm(lb[i].pid))}</div>
    <div class="blk" style="height:${h[order.indexOf(i)]}px">${medal[i]}</div>
    <div class="s">${lb[i].score} b.</div></div>`).join('');
  $('#flb').innerHTML = lb.map((x,i) => `<div class="lbrow"><span class="rank">${i+1}</span><span class="grow nm">${esc(nm(x.pid))}${x.pid===myId?'<span class="me-tag">ty</span>':''}</span><span class="tot">${x.score}</span></div>`).join('');
}

/* ================= smyčka ================= */
setInterval(() => { if(S.code && S.room) render(false); }, 100);
setInterval(hostLoop, 1000);
init();
</script>
</body>
</html>
